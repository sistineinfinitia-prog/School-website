<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Highwood CS</title>
    
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body {
            background-color: var(--bg-main);
        }

        .admin-container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: var(--spacing-xl) var(--spacing-md);
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--text-main);
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .card {
            background: var(--bg-section);
            padding: var(--spacing-lg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-soft);
            margin-bottom: var(--spacing-lg);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .form-group { margin-bottom: var(--spacing-md); }
        
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .form-group input, 
        .form-group textarea { 
            width: 100%; 
            padding: 12px 16px; 
            border: 1px solid rgba(0,0,0,0.1); 
            border-radius: 12px; 
            font-family: var(--font-main);
            background: var(--bg-main);
            transition: var(--transition);
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(128, 0, 0, 0.05);
            background: #fff;
        }

        .error-message { 
            background: #ffebee;
            color: #c62828;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .success-message { 
            background: #e8f5e9;
            color: #2e7d32;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .post-list h3 { 
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .post-card { 
            background: #fff;
            border-radius: 15px;
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .delete-btn { 
            background: #ff4d4d; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 0.8rem;
            transition: var(--transition);
        }

        .delete-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        .logout-btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: var(--border-radius-pill);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>
    <header></header>

    <div class="admin-container">
        <div id="login-section">
            <h1 class="section-title">Admin Access</h1>
            <div class="card" style="max-width: 500px; margin: 0 auto;">
                <form id="login-form">
                    <div class="form-group">
                        <label for="admin-key">Admin Passkey</label>
                        <input type="password" id="admin-key" placeholder="Enter key..." required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Sign In</button>
                    <p id="login-error" class="error-message" style="display: none;"></p>
                </form>
            </div>
        </div>

        <div id="admin-section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
                <h1 style="font-weight: 800; font-size: 2rem; letter-spacing: -1px;">Dashboard</h1>
                <button id="logout-btn" class="logout-btn">Sign Out</button>
            </div>
            
            <div class="card">
                <h2 style="margin-bottom: var(--spacing-md); font-weight: 700;">New Announcement</h2>
                <form id="post-form">
                    <div class="form-group">
                        <label for="post-title">Title</label>
                        <input type="text" id="post-title" required>
                    </div>
                    <div class="form-group">
                        <label for="post-desc">Content</label>
                        <textarea id="post-desc" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="post-link">Drive Link (Optional)</label>
                        <input type="url" id="post-link" placeholder="https://drive.google.com/...">
                    </div>
                    <button type="submit" class="btn" id="submit-btn">Publish Announcement</button>
                    <p id="post-status"></p>
                </form>
            </div>

            <div class="post-list" id="post-list">
                <h3>Manage Announcements</h3>
                <div id="posts-container">
                    <p style="text-align: center;">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <footer></footer>

    <script src="../js/ui.js"></script>
    <script type="module">
        import { auth, db, ref } from "../js/config.js";
        import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { ref as dbRef, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const loginSection = document.getElementById("login-section");
        const adminSection = document.getElementById("admin-section");
        const loginForm = document.getElementById("login-form");
        const loginError = document.getElementById("login-error");
        const logoutBtn = document.getElementById("logout-btn");
        const postForm = document.getElementById("post-form");
        const postStatus = document.getElementById("post-status");
        const submitBtn = document.getElementById("submit-btn");
        const postsContainer = document.getElementById("posts-container");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = "none";
                adminSection.style.display = "block";
                loadPosts();
            } else {
                loginSection.style.display = "block";
                adminSection.style.display = "none";
            }
        });

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const key = document.getElementById("admin-key").value;
            signInWithEmailAndPassword(auth, "admin@highwood.edu", key)
                .catch((error) => {
                    loginError.textContent = "Access Denied: Incorrect Key.";
                    loginError.style.display = "block";
                });
        });

        logoutBtn.addEventListener("click", () => signOut(auth));

        postForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            submitBtn.textContent = "Publishing...";
            submitBtn.disabled = true;

            try {
                const title = document.getElementById("post-title").value;
                const desc = document.getElementById("post-desc").value;
                const link = document.getElementById("post-link").value;

                const newPostRef = push(dbRef(db, 'posts'));
                await set(newPostRef, { title, description: desc, date: new Date().toISOString(), driveLink: link });

                postStatus.textContent = "Announcement published!";
                postStatus.className = "success-message";
                postForm.reset();
            } catch (error) {
                postStatus.textContent = "Error: " + error.message;
                postStatus.className = "error-message";
            } finally {
                submitBtn.textContent = "Publish Announcement";
                submitBtn.disabled = false;
            }
        });

        function loadPosts() {
            onValue(dbRef(db, 'posts'), (snapshot) => {
                postsContainer.innerHTML = "";
                const posts = [];
                snapshot.forEach((childSnapshot) => {
                    posts.push({ id: childSnapshot.key, ...childSnapshot.val() });
                });

                posts.sort((a, b) => new Date(b.date) - new Date(a.date));

                if (posts.length === 0) {
                    postsContainer.innerHTML = "<p style='text-align: center; opacity: 0.6;'>No announcements found.</p>";
                    return;
                }

                posts.forEach(post => {
                    const card = document.createElement("div");
                    card.className = "post-card";
                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div style="flex: 1;">
                                <h4 style="font-weight: 700; color: var(--primary); font-size: 1.2rem; margin-bottom: 4px;">${post.title}</h4>
                                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;">${new Date(post.date).toLocaleDateString()}</p>
                                <p style="color: var(--text-body); font-size: 0.95rem; line-height: 1.6;">${post.description}</p>
                            </div>
                            <button class="delete-btn" onclick="window.deletePost('${post.id}')">Delete</button>
                        </div>
                    `;
                    postsContainer.appendChild(card);
                });
            });
        }

        window.deletePost = async (id) => {
            if (confirm("Delete this announcement?")) {
                await remove(dbRef(db, 'posts/' + id));
            }
        };
    </script>
</body>
</html>
