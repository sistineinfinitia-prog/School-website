<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highwood CS | Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="glass-panel"></header>

    <section class="hero">
        <h1>Advanced CS Academy</h1>
        <p>A comprehensive journey through modern computation, algorithmic thinking, and digital innovation.</p>
    </section>

    <main>
        <div class="card-grid" id="courses-grid">
            <!-- Courses injected here -->
        </div>

        <div class="posts-feed" style="margin-top: 5rem;">
            <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 3rem;">
                <h2
                    style="font-family: var(--font-heading); color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem;">
                    Latest Announcements</h2>
            </div>
            <div id="posts-container"
                style="display: flex; flex-direction: column; gap: 2.5rem; max-width: 900px; margin: 0 auto;">
                <p style="text-align: center;">Loading announcements...</p>
            </div>
        </div>
    </main>

    <footer></footer>

    <!-- Scripts -->
    <script src="js/ui.js"></script>
    <script type="module">
        import { db, ref } from "./js/config.js";
        import { onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        // Load Courses
        fetch('data/courses.json')
            .then(res => res.json())
            .then(courses => {
                const grid = document.getElementById('courses-grid');
                grid.innerHTML = courses.map(course => `
                    <div class="card">
                        <h2>${course.title}</h2>
                        <p>${course.description}</p>
                        <a href="${course.link}" class="btn">Explore Module</a>
                    </div>
                `).join('');
            });

        // Load Announcements
        const postsRef = ref(db, 'posts');
        const container = document.getElementById("posts-container");

        onValue(postsRef, (snapshot) => {
            container.innerHTML = "";
            const posts = [];
            snapshot.forEach((childSnapshot) => {
                posts.push(childSnapshot.val());
            });

            posts.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (posts.length === 0) {
                container.innerHTML = "<p style='text-align: center;'>No announcements available.</p>";
                return;
            }

            posts.forEach(post => {
                const postElement = document.createElement("div");
                postElement.className = "card";
                postElement.style.padding = "3rem";

                postElement.innerHTML = `
                    <h3>${post.title}</h3>
                    <p style="color:gray; font-size:0.9rem; margin-bottom:1rem;">${new Date(post.date).toLocaleString()}</p>
                    <p style="margin-bottom:2rem; font-size:1.1rem; line-height:1.8;">${post.description}</p>
                `;

                if (post.driveLink) {
                    const linkBtn = document.createElement("a");
                    linkBtn.href = post.driveLink;
                    linkBtn.className = "btn";
                    linkBtn.target = "_blank";
                    linkBtn.textContent = "Open Attached File";
                    postElement.appendChild(linkBtn);
                }

                container.appendChild(postElement);
            });
        });
    </script>
</body>

</html>
