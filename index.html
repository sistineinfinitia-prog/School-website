<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highwood CS | Home</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header></header>

    <section class="hero">
        <div class="hero-content">
            <span class="hero-badge">Advanced Placement & Beyond</span>
            <h1>Computer Science Academy</h1>
            <p>A comprehensive journey through modern computation, algorithmic thinking, and digital innovation.</p>
            
            <div class="hero-search">
                <input type="text" placeholder="Search for modules or resources...">
                <button class="btn">Explore</button>
            </div>
        </div>
        <div class="hero-visual">
            <div class="circle-bg"></div>
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=400&q=80" alt="Student 1" class="float-img img-1">
            <img src="https://images.unsplash.com/photo-1531512073830-ba890ca4eba2?w=400&q=80" alt="Student 2" class="float-img img-2">
            <img src="https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?w=400&q=80" alt="Student 3" class="float-img img-3">
        </div>
    </section>

    <div class="wave-divider"></div>

    <main class="content-section">
        <div class="section-container">
            <div class="section-header">
                <h2>Explore the Curriculum</h2>
            </div>
            <div class="card-grid" id="courses-grid">
                <!-- Courses injected here -->
            </div>

            <div class="section-header" style="margin-top: var(--spacing-xxl);">
                <h2>Latest Announcements</h2>
            </div>
            <div id="posts-container" class="card-grid" style="max-width: 900px; margin: 0 auto; display: flex; flex-direction: column;">
                <p style="text-align: center;">Loading announcements...</p>
            </div>
        </div>
    </main>

    <footer></footer>

    <!-- Scripts -->
    <script src="js/ui.js"></script>
    <script type="module">
        import { db, ref } from "./js/config.js";
        import { onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        // Load Courses
        fetch('data/courses.json')
            .then(res => res.json())
            .then(courses => {
                const grid = document.getElementById('courses-grid');
                grid.innerHTML = courses.map((course, i) => {
                    const tagClass = i % 3 === 0 ? 'tag-purple' : i % 3 === 1 ? 'tag-blue' : 'tag-coral';
                    return `
                    <div class="card">
                        <span class="tag ${tagClass}">Module ${i + 1}</span>
                        <h2>${course.title}</h2>
                        <p>${course.description}</p>
                        <a href="${course.link}" class="btn">Explore Module</a>
                    </div>
                `}).join('');
            });

        // Load Announcements
        const postsRef = ref(db, 'posts');
        const container = document.getElementById("posts-container");

        onValue(postsRef, (snapshot) => {
            container.innerHTML = "";
            const posts = [];
            snapshot.forEach((childSnapshot) => {
                posts.push(childSnapshot.val());
            });

            posts.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (posts.length === 0) {
                container.innerHTML = "<p style='text-align: center;'>No announcements available.</p>";
                return;
            }

            posts.forEach(post => {
                const postElement = document.createElement("div");
                postElement.className = "card";

                postElement.innerHTML = `
                    <span class="tag tag-coral">Announcement</span>
                    <h3>${post.title}</h3>
                    <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">${new Date(post.date).toLocaleString()}</p>
                    <p style="margin-bottom:2rem; font-size:1rem; line-height:1.7;">${post.description}</p>
                `;

                if (post.driveLink) {
                    const linkBtn = document.createElement("a");
                    linkBtn.href = post.driveLink;
                    linkBtn.className = "btn";
                    linkBtn.target = "_blank";
                    linkBtn.textContent = "Open Attached File";
                    postElement.appendChild(linkBtn);
                }

                container.appendChild(postElement);
            });
        });
    </script>
</body>

</html>
