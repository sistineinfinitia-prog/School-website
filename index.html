<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highwood CS | Home</title>

    <link rel="stylesheet" href="css/main.css">
    <style>
        .announcements-wrapper {
            background: #fff;
            border-radius: var(--border-radius);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-soft);
            margin-top: -150px;
            position: relative;
            z-index: 10;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-state img {
            width: 150px;
            opacity: 0.5;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <header></header>

    <section class="hero">
        <div class="hero-content">
            <span class="hero-badge">Advanced Placement & Beyond</span>
            <h1>Computer Science Academy</h1>
            <p>A comprehensive journey through modern computation, algorithmic thinking, and digital innovation.</p>
            
        </div>
        <div class="hero-visual">
            <div class="circle-bg"></div>
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=400&q=80" alt="Student 1" class="float-img img-1">
            <img src="https://images.unsplash.com/photo-1531512073830-ba890ca4eba2?w=400&q=80" alt="Student 2" class="float-img img-2">
            <img src="https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?w=400&q=80" alt="Student 3" class="float-img img-3">
        </div>
    </section>

    <div class="wave-divider"></div>

    <main class="content-section" style="background: var(--bg-section);">
        <div class="section-container">
            <div class="announcements-wrapper">
                <div class="section-header" style="text-align: left; margin-bottom: var(--spacing-lg); display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        <span class="tag tag-coral">Stay Updated</span>
                        <h2 style="font-size: 2.5rem; margin-top: 10px;">Latest Announcements</h2>
                    </div>
                    <div style="font-size: 0.9rem; color: var(--text-muted);">
                        Real-time updates from our department
                    </div>
                </div>

                <div id="posts-container" style="display: flex; flex-direction: column; gap: 30px;">
                    <div class="empty-state" id="loading-state">
                        <p>Loading the latest updates for you...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer></footer>

    <!-- Scripts -->
    <script src="js/ui.js"></script>
    <script type="module">
        import { db, ref } from "./js/config.js";
        import { onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const postsRef = ref(db, 'posts');
        const container = document.getElementById("posts-container");

        onValue(postsRef, (snapshot) => {
            container.innerHTML = "";
            
            if (!snapshot.exists()) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3 style="color: var(--primary);">All quiet for now!</h3>
                        <p>No announcements have been posted yet. Check back soon for exciting news.</p>
                    </div>
                `;
                return;
            }

            const posts = [];
            snapshot.forEach((childSnapshot) => {
                posts.push(childSnapshot.val());
            });

            posts.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3 style="color: var(--primary);">All quiet for now!</h3>
                        <p>No announcements have been posted yet. Check back soon for exciting news.</p>
                    </div>
                `;
                return;
            }

            posts.forEach((post, index) => {
                const postElement = document.createElement("div");
                postElement.className = "card";
                postElement.style.width = "100%";
                postElement.style.borderLeft = index === 0 ? "5px solid var(--primary)" : "none";

                postElement.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
                        <div>
                            <span class="tag ${index === 0 ? 'tag-purple' : 'tag-coral'}">${index === 0 ? 'Featured' : 'Announcement'}</span>
                            <h3 style="font-size: 1.8rem; margin-top: 10px;">${post.title}</h3>
                        </div>
                        <span style="font-size: 0.85rem; color: var(--text-muted); background: var(--bg-accent); padding: 5px 12px; border-radius: 20px;">
                            ${new Date(post.date).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' })}
                        </span>
                    </div>
                    <p style="margin-bottom: 2rem; font-size: 1.1rem; line-height: 1.8; color: var(--text-body);">${post.description}</p>
                `;

                if (post.driveLink) {
                    const linkBtn = document.createElement("a");
                    linkBtn.href = post.driveLink;
                    linkBtn.className = "btn";
                    linkBtn.target = "_blank";
                    linkBtn.style.padding = "10px 20px";
                    linkBtn.innerHTML = `View Document <svg style="margin-left:8px;" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2z"/></svg>`;
                    postElement.appendChild(linkBtn);
                }

                container.appendChild(postElement);
            });
        });
    </script>
</body>

</html>
